name: Kubernetes manifest linting

on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - 'scripts/validate-kubernetes-manifests.py'
      - '.github/workflows/kubernetes-manifest-linting.yaml'
  push:
    branches:
      - main
    paths:
      - '**/*.yaml'
      - '**/*.yml'
      - 'scripts/validate-kubernetes-manifests.py'
      - '.github/workflows/kubernetes-manifest-linting.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  manifest-linting:
    name: YAML, Kustomize, kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python -m pip install --upgrade pyyaml

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Set up kubeconform
        env:
          KUBECONFORM_VERSION: v0.6.7
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install -m 0755 /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate Kubernetes manifests
        run: python scripts/validate-kubernetes-manifests.py
