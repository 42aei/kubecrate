<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 256 300" role="img" aria-labelledby="title desc">
<title id="title">KubeCrate logo</title>
<desc id="desc">A blue isometric crate with a Kubernetes-inspired badge, used as the KubeCrate logo.</desc>


<defs>
  <linearGradient id="kcBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38BDF8"/>
    <stop offset="48%" stop-color="#2563EB"/>
    <stop offset="100%" stop-color="#1D4ED8"/>
  </linearGradient>
  <linearGradient id="kcNavy" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0F2A5F"/>
    <stop offset="100%" stop-color="#061A3A"/>
  </linearGradient>
  <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feDropShadow dx="0" dy="14" stdDeviation="10" flood-color="#0B1F4D" flood-opacity="0.20"/>
  </filter>
</defs>
<g id="kubecrate-icon" filter="url(#softShadow)" stroke-linejoin="round" stroke-linecap="round">
  <!-- crate top -->
  <path d="M128 58 L225 114 L128 169 L31 114 Z" fill="#0B1F4D"/>
  <path d="M128 75 L196 114 L128 153 L60 114 Z" fill="#123A88" opacity="0.65"/>
  <!-- left side -->
  <path d="M31 114 L128 169 L128 282 L31 226 Z" fill="url(#kcBlue)" stroke="#071A3D" stroke-width="11"/>
  <!-- right side -->
  <path d="M225 114 L128 169 L128 282 L225 226 Z" fill="#1E63E9" stroke="#071A3D" stroke-width="11"/>
  <!-- crate boards -->
  <path d="M50 152 L109 185" stroke="#09204A" stroke-width="9"/>
  <path d="M50 190 L109 224" stroke="#09204A" stroke-width="9"/>
  <path d="M50 226 L109 260" stroke="#09204A" stroke-width="9"/>
  <path d="M147 185 L206 152" stroke="#09204A" stroke-width="9"/>
  <path d="M147 224 L206 190" stroke="#09204A" stroke-width="9"/>
  <path d="M154 239 L206 151" stroke="#09204A" stroke-width="8"/>
  <path d="M206 151 L206 226 L154 254 Z" fill="none" stroke="#09204A" stroke-width="9"/>
  <!-- handles -->
  <path d="M62 136 L88 151" stroke="#061A3A" stroke-width="10" opacity=".85"/>
  <path d="M168 150 L194 136" stroke="#061A3A" stroke-width="10" opacity=".85"/>
  <!-- kube badge -->
  <path d="M128 5 L191 41 Q201 47 201 59 L201 130 Q201 142 191 148 L128 184 L65 148 Q55 142 55 130 L55 59 Q55 47 65 41 Z" fill="url(#kcBlue)" stroke="#FFFFFF" stroke-width="9"/>
  <!-- wheel -->
  <circle cx="128" cy="96" r="43" fill="none" stroke="#FFFFFF" stroke-width="9"/>
  <circle cx="128" cy="96" r="10" fill="#FFFFFF"/>
  <g stroke="#FFFFFF" stroke-width="9">
    <path d="M128 37 L128 63"/>
    <path d="M128 129 L128 155"/>
    <path d="M69 96 L95 96"/>
    <path d="M161 96 L187 96"/>
    <path d="M86 54 L105 73"/>
    <path d="M151 119 L170 138"/>
    <path d="M170 54 L151 73"/>
    <path d="M105 119 L86 138"/>
  </g>
</g>

</svg>