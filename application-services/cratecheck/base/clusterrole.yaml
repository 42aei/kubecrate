apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cratecheck-readonly
  labels:
    app.kubernetes.io/name: cratecheck
    app.kubernetes.io/part-of: kubecrate
rules:
  # Discovery API access required by the dynamic client REST mapper
  - nonResourceURLs:
      - /api
      - /api/*
      - /apis
      - /apis/*
    verbs:
      - get
  # Resources checked by the initial baseline StatusConfig
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
  # Future platform service checks may require additional read verbs on resources
  # such as secrets, ingresses, certificates, or custom resources.
  # Expand this ClusterRole incrementally as new checks are added to the StatusConfig.
