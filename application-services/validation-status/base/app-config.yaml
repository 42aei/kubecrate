apiVersion: v1
kind: ConfigMap
metadata:
  name: validation-status-app
  labels:
    app.kubernetes.io/name: validation-status
    app.kubernetes.io/part-of: kubecrate
    kubecrate.io/workload-category: application-services
data:
  app.py: |
    import json
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from html import escape

    APP_NAME = "kubecrate-validation-status"
    VERSION = "v0.1.0"

    CHECKS = [
        {
            "id": "base-app-health",
            "name": "Base app health",
            "state": "green",
            "capability": "The validation application service is running and can answer status requests.",
            "area": "application service workload and Kubernetes Service",
            "enabled": True,
            "summary": "The status app process is healthy and serving the UI and JSON contract.",
            "troubleshooting": "If this is not green, inspect the validation-status Deployment, Pods, Service endpoints, and recent Pod logs before investigating platform services.",
        },
        {
            "id": "secret-loading",
            "name": "Secret loading",
            "state": "not_configured",
            "capability": "Application service consumption of projected Kubernetes Secret data.",
            "area": "External-Secrets Operator, Secret projection, Pod environment or volume wiring",
            "enabled": False,
            "summary": "Secret consumption is reserved for a later platform service slice and is not enabled in this base fixture.",
            "troubleshooting": "When enabled, inspect ExternalSecret reconciliation, the generated Secret, Pod mounts or environment variables, and application logs for missing keys.",
        },
        {
            "id": "ingress-reachability",
            "name": "Ingress reachability",
            "state": "not_configured",
            "capability": "HTTP reachability through the cluster ingress path.",
            "area": "Gateway or ingress controller, HTTPRoute or Ingress, Service backend wiring",
            "enabled": False,
            "summary": "Ingress is not installed by this slice; use kubectl port-forward for the initial validation path.",
            "troubleshooting": "When enabled, inspect gateway listener readiness, route attachment status, Service endpoints, DNS or host mapping, and gateway controller logs.",
        },
        {
            "id": "certificate-tls-status",
            "name": "Certificate/TLS status",
            "state": "not_configured",
            "capability": "TLS certificate issuance and use by the application access path.",
            "area": "cert-manager Certificate, Issuer or ClusterIssuer, TLS Secret, gateway TLS binding",
            "enabled": False,
            "summary": "Certificate management is reserved for a later platform service slice and is not required for this base app.",
            "troubleshooting": "When enabled, inspect Certificate readiness, issuer events, ACME or CA errors, TLS Secret contents, and the gateway or ingress TLS reference.",
        },
        {
            "id": "observability-signal-path",
            "name": "Observability signal path",
            "state": "not_configured",
            "capability": "Application signals can reach the configured observability path.",
            "area": "metrics, logs, traces, collectors, dashboards, and backend ingestion",
            "enabled": False,
            "summary": "No observability backend is installed by this slice, so signal validation is intentionally not configured.",
            "troubleshooting": "When enabled, inspect application scrape annotations or exporters, collector pipelines, backend ingestion status, and dashboard queries.",
        },
        {
            "id": "policy-behavior",
            "name": "Policy behavior",
            "state": "not_configured",
            "capability": "Expected policy admission or mutation behavior is visible to the application service fixture.",
            "area": "policy engine, admission controller, policy definitions, and resource events",
            "enabled": False,
            "summary": "Policy validation is reserved for a later platform service slice and is not active in this base fixture.",
            "troubleshooting": "When enabled, inspect policy reports, admission events, controller logs, and whether the fixture resource matches the policy selectors.",
        },
    ]

    def status_payload():
        return {
            "app": APP_NAME,
            "version": VERSION,
            "overallStatus": "green",
            "generatedAt": datetime.now(timezone.utc).isoformat(),
            "checks": CHECKS,
        }

    def render_html(payload):
        cards = []
        for check in payload["checks"]:
            state = check["state"]
            enabled = "enabled" if check["enabled"] else "not enabled"
            cards.append(f"""
            <article class="check check-{escape(state)}">
              <div class="check-heading">
                <h2>{escape(check['name'])}</h2>
                <span class="state">{escape(state.replace('_', ' '))}</span>
              </div>
              <p class="summary">{escape(check['summary'])}</p>
              <dl>
                <div><dt>Capability</dt><dd>{escape(check['capability'])}</dd></div>
                <div><dt>Area</dt><dd>{escape(check['area'])}</dd></div>
                <div><dt>Enabled</dt><dd>{escape(enabled)}</dd></div>
                <div><dt>Troubleshooting</dt><dd>{escape(check['troubleshooting'])}</dd></div>
              </dl>
            </article>
            """)
        return f"""<!doctype html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Kubecrate validation status</title>
      <style>
        :root {{
          color-scheme: dark;
          --bg: #0f172a;
          --panel: #111827;
          --panel-2: #1e293b;
          --text: #e5e7eb;
          --muted: #94a3b8;
          --green: #22c55e;
          --amber: #f59e0b;
          --red: #ef4444;
          --blue: #38bdf8;
          --line: rgba(148, 163, 184, 0.25);
        }}
        * {{ box-sizing: border-box; }}
        body {{
          margin: 0;
          font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
          background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.18), transparent 32rem), var(--bg);
          color: var(--text);
          line-height: 1.5;
        }}
        main {{ width: min(1120px, calc(100% - 2rem)); margin: 0 auto; padding: 2rem 0 3rem; }}
        .hero {{ display: grid; gap: 1rem; padding: 1.5rem; border: 1px solid var(--line); border-radius: 1.5rem; background: linear-gradient(135deg, rgba(17, 24, 39, 0.94), rgba(30, 41, 59, 0.82)); box-shadow: 0 24px 80px rgba(0,0,0,0.32); }}
        .eyebrow {{ color: var(--blue); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.78rem; }}
        h1 {{ margin: 0; font-size: clamp(2rem, 5vw, 4rem); letter-spacing: -0.05em; }}
        .hero p {{ margin: 0; color: var(--muted); max-width: 72ch; }}
        .status-row {{ display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.5rem; }}
        .pill {{ display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.55rem 0.8rem; border-radius: 999px; background: rgba(15, 23, 42, 0.86); border: 1px solid var(--line); color: var(--muted); }}
        .pill strong {{ color: var(--text); }}
        .dot {{ width: 0.7rem; height: 0.7rem; border-radius: 999px; background: var(--green); box-shadow: 0 0 24px var(--green); }}
        .grid {{ display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; margin-top: 1rem; }}
        .check {{ border: 1px solid var(--line); border-radius: 1.15rem; padding: 1rem; background: rgba(17, 24, 39, 0.9); }}
        .check-heading {{ display: flex; align-items: start; justify-content: space-between; gap: 1rem; }}
        h2 {{ margin: 0; font-size: 1.05rem; }}
        .state {{ white-space: nowrap; border-radius: 999px; padding: 0.28rem 0.58rem; font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; }}
        .check-green .state {{ color: #052e16; background: var(--green); }}
        .check-yellow .state {{ color: #451a03; background: var(--amber); }}
        .check-red .state {{ color: #450a0a; background: var(--red); }}
        .check-not_configured .state {{ color: #082f49; background: var(--blue); }}
        .summary {{ color: var(--text); margin: 0.8rem 0; }}
        dl {{ display: grid; gap: 0.65rem; margin: 0; }}
        dt {{ color: var(--muted); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; }}
        dd {{ margin: 0.12rem 0 0; color: #dbeafe; }}
        .footer {{ color: var(--muted); margin-top: 1rem; font-size: 0.9rem; }}
        a {{ color: var(--blue); }}
        @media (max-width: 760px) {{ main {{ width: min(100% - 1rem, 1120px); padding-top: 0.5rem; }} .grid {{ grid-template-columns: 1fr; }} .hero {{ border-radius: 1rem; }} }}
      </style>
    </head>
    <body>
      <main>
        <section class="hero">
          <div class="eyebrow">application services · kind-first local path</div>
          <h1>Kubecrate validation status</h1>
          <p>This fixture proves that an application service can participate in GitOps-managed operation and exposes a stable status contract for future platform service validation slices.</p>
          <div class="status-row">
            <span class="pill"><span class="dot"></span>Overall <strong>{escape(payload['overallStatus'])}</strong></span>
            <span class="pill">Version <strong>{escape(payload['version'])}</strong></span>
            <span class="pill">JSON <strong>/status.json</strong></span>
          </div>
        </section>
        <section class="grid" aria-label="Validation checks">
          {''.join(cards)}
        </section>
        <p class="footer">Generated at {escape(payload['generatedAt'])}. Future platform service checks intentionally report not configured until their slice enables them.</p>
      </main>
    </body>
    </html>"""

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path in ("/status.json", "/status"):
                body = json.dumps(status_payload(), indent=2).encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "application/json; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return
            if self.path in ("/", "/index.html"):
                body = render_html(status_payload()).encode("utf-8")
                self.send_response(200)
                self.send_header("Content-Type", "text/html; charset=utf-8")
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
                return
            self.send_response(404)
            self.end_headers()

        def log_message(self, format, *args):
            print("%s - - [%s] %s" % (self.client_address[0], self.log_date_time_string(), format % args), flush=True)

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
