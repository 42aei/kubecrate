apiVersion: v1
kind: ConfigMap
metadata:
  name: validation-status-app
  labels:
    app.kubernetes.io/name: validation-status
    app.kubernetes.io/part-of: kubecrate
    kubecrate.io/workload-category: application-services
data:
  app.py: |
    import copy
    import json
    import os
    import ssl
    import urllib.request
    from datetime import datetime, timezone
    from html import escape
    from http.server import BaseHTTPRequestHandler, HTTPServer

    CONFIG_PATH = os.getenv("VALIDATION_STATUS_CONFIG", "/config/config.json")
    API_SERVER = os.getenv("KUBERNETES_SERVICE_HOST")
    API_PORT = os.getenv("KUBERNETES_SERVICE_PORT", "443")
    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

    def load_config():
        with open(CONFIG_PATH, "r", encoding="utf-8") as config_file:
            return json.load(config_file)

    def api_get(path):
        if not API_SERVER:
            raise RuntimeError("KUBERNETES_SERVICE_HOST is not set")
        with open(TOKEN_PATH, "r", encoding="utf-8") as token_file:
            token = token_file.read().strip()
        url = f"https://{API_SERVER}:{API_PORT}{path}"
        ctx = ssl.create_default_context(cafile=CA_PATH)
        req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/json"})
        with urllib.request.urlopen(req, context=ctx, timeout=4) as response:
            return json.loads(response.read().decode("utf-8"))

    def condition(resource, condition_type):
        for item in resource.get("status", {}).get("conditions", []):
            if item.get("type") == condition_type:
                return item
        return {}

    def path_lookup(data, expression):
        current = data
        for part in expression.split("."):
            if "[" in part and part.endswith("]"):
                field, selector = part[:-1].split("[", 1)
                current = current.get(field, []) if isinstance(current, dict) else []
                key, expected = selector.split("=", 1)
                current = next((item for item in current if item.get(key) == expected), {})
            elif isinstance(current, dict):
                current = current.get(part)
            else:
                return None
        return current

    def green_or_red(ok):
        return "green" if ok else "red"

    def not_configured(check):
        return {
            "id": check["id"],
            "name": check["name"],
            "state": "not_configured",
            "capability": check["capability"],
            "area": check["area"],
            "enabled": False,
            "summary": check.get("summary", "This check is not enabled for the current slice."),
            "troubleshooting": check["troubleshooting"],
        }

    def deployment_service_endpoints(check):
        dep_cfg = check["deployment"]
        svc_cfg = check["service"]
        ep_cfg = check["endpoints"]
        deployment = api_get(f"/apis/apps/v1/namespaces/{dep_cfg['namespace']}/deployments/{dep_cfg['name']}")
        service = api_get(f"/api/v1/namespaces/{svc_cfg['namespace']}/services/{svc_cfg['name']}")
        endpoints = api_get(f"/api/v1/namespaces/{ep_cfg['namespace']}/endpoints/{ep_cfg['name']}")
        available = deployment.get("status", {}).get("availableReplicas", 0)
        desired = deployment.get("spec", {}).get("replicas", 1)
        endpoint_count = sum(len(subset.get("addresses", [])) for subset in endpoints.get("subsets", []))
        cluster_ip = service.get("spec", {}).get("clusterIP")
        ok = available >= desired and cluster_ip not in (None, "", "None") and endpoint_count > 0
        result = base_result(check)
        result.update({
            "state": green_or_red(ok),
            "summary": f"Deployment availability {available}/{desired}; Service clusterIP {cluster_ip or 'missing'}; ready endpoints {endpoint_count}.",
            "observed": {"availableReplicas": available, "desiredReplicas": desired, "endpointCount": endpoint_count},
        })
        return result

    def condition_check(check):
        resource_cfg = check["resource"]
        resource = api_get(resource_cfg["apiPath"])
        ready = condition(resource, resource_cfg.get("conditionType", "Ready"))
        observed = {}
        for key, expression in resource_cfg.get("observedFields", {}).items():
            observed[key] = path_lookup(resource, expression)
        ok = ready.get("status") == "True"
        result = base_result(check)
        result.update({
            "state": green_or_red(ok),
            "summary": ready.get("message", f"{resource_cfg.get('conditionType', 'Ready')} condition is missing."),
            "observed": observed,
        })
        return result

    def base_result(check):
        return {
            "id": check["id"],
            "name": check["name"],
            "capability": check["capability"],
            "area": check["area"],
            "enabled": bool(check.get("enabled", True)),
            "troubleshooting": check["troubleshooting"],
        }

    CHECK_TYPES = {
        "deployment_service_endpoints": deployment_service_endpoints,
        "condition": condition_check,
        "not_configured": not_configured,
    }

    def evaluate_check(check):
        if not check.get("enabled", True) or check.get("type") == "not_configured":
            return not_configured(check)
        try:
            evaluator = CHECK_TYPES[check["type"]]
        except KeyError:
            raise RuntimeError(f"unknown check type: {check.get('type')}")
        return evaluator(check)

    def live_checks(config):
        checks = []
        for check in config.get("checks", []):
            try:
                checks.append(evaluate_check(check))
            except Exception as exc:
                failed = base_result(check)
                failed.update({
                    "state": "red",
                    "summary": f"Failed to evaluate configured Kubernetes API check: {type(exc).__name__}: {exc}",
                    "observed": {"error": f"{type(exc).__name__}: {exc}"},
                })
                checks.append(failed)
        return checks

    def status_payload():
        config = load_config()
        checks = live_checks(config)
        enabled = [check for check in checks if check.get("enabled")]
        counts = {
            "green": sum(1 for check in checks if check["state"] == "green"),
            "red": sum(1 for check in checks if check["state"] == "red"),
            "yellow": sum(1 for check in checks if check["state"] == "yellow"),
            "not_configured": sum(1 for check in checks if check["state"] == "not_configured"),
            "enabled": len(enabled),
            "total": len(checks),
        }
        overall = "red" if any(check["state"] == "red" for check in enabled) else "green"
        health_score = round((counts["green"] / counts["enabled"]) * 100) if counts["enabled"] else 0
        return {
            "app": config.get("app", "kubecrate-validation-status"),
            "version": config.get("version", "v0.3.0"),
            "overallStatus": overall,
            "healthScore": health_score,
            "generatedAt": datetime.now(timezone.utc).isoformat(),
            "source": config.get("source", "live-kubernetes-api"),
            "title": config.get("title", "Kubecrate validation status"),
            "description": config.get("description", "Configured checks are evaluated from live Kubernetes API output."),
            "summary": counts,
            "checks": checks,
        }

    def pct(value, total):
        return round((value / total) * 100) if total else 0

    def render_html(payload):
        icons = {"green": "✓", "red": "✕", "yellow": "!", "not_configured": "○"}
        labels = {"green": "Passing", "red": "Failing", "yellow": "Warning", "not_configured": "Not configured"}
        summary = payload["summary"]
        chart_rows = []
        for state in ("green", "red", "yellow", "not_configured"):
            value = summary[state]
            width = pct(value, summary["total"])
            chart_rows.append(f"""
              <div class="chart-row" data-state="{escape(state)}">
                <div class="flex items-center justify-between gap-4 text-sm"><span>{escape(labels[state])}</span><span class="text-muted-foreground">{value} / {summary['total']}</span></div>
                <div class="chart-track" role="img" aria-label="{escape(labels[state])}: {value} of {summary['total']} checks"><span class="chart-fill chart-{escape(state)}" style="width:{width}%"></span></div>
              </div>
            """)
        cards = []
        for check in payload["checks"]:
            state = check["state"]
            enabled = "enabled" if check["enabled"] else "not enabled"
            observed = check.get("observed") or {}
            observed_html = ""
            if observed:
                observed_html = "<div class='grid gap-1'><dt class='text-muted-foreground text-xs font-medium uppercase tracking-wide'>Observed</dt><dd><code class='rounded-md bg-muted px-2 py-1 text-xs text-muted-foreground break-anywhere'>" + escape(json.dumps(observed, sort_keys=True)) + "</code></dd></div>"
            cards.append(f"""
            <article class="check-card rounded-xl border bg-card text-card-foreground shadow-sm" data-state="{escape(state)}">
              <button class="card-toggle" type="button" aria-expanded="false">
                <div class="flex items-start justify-between gap-4">
                  <div class="grid gap-2"><h2 class="flex items-center gap-2 text-lg font-semibold leading-none tracking-tight"><span class="status-icon status-{escape(state)}" aria-hidden="true">{icons.get(state, '?')}</span>{escape(check['name'])}</h2><p class="text-sm text-muted-foreground">{escape(check['summary'])}</p></div>
                  <span class="badge badge-{escape(state)}">{escape(state.replace('_', ' '))}</span>
                </div>
              </button>
              <div class="card-details grid gap-4 p-6 pt-0">
                <dl class="grid gap-3 text-sm">
                  <div class="grid gap-1"><dt class="text-muted-foreground text-xs font-medium uppercase tracking-wide">Capability</dt><dd>{escape(check['capability'])}</dd></div>
                  <div class="grid gap-1"><dt class="text-muted-foreground text-xs font-medium uppercase tracking-wide">Area</dt><dd>{escape(check['area'])}</dd></div>
                  <div class="grid gap-1"><dt class="text-muted-foreground text-xs font-medium uppercase tracking-wide">Enabled</dt><dd>{escape(enabled)}</dd></div>
                  {observed_html}
                  <div class="grid gap-1"><dt class="text-muted-foreground text-xs font-medium uppercase tracking-wide">Troubleshooting</dt><dd class="text-muted-foreground">{escape(check['troubleshooting'])}</dd></div>
                </dl>
              </div>
            </article>
            """)
        return f"""<!doctype html>
    <html lang="en" class="dark">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>{escape(payload['title'])}</title>
      <style>
        :root {{ --background: 0 0% 100%; --foreground: 222.2 84% 4.9%; --card: 0 0% 100%; --card-foreground: 222.2 84% 4.9%; --muted: 210 40% 96.1%; --muted-foreground: 215.4 16.3% 46.9%; --border: 214.3 31.8% 91.4%; --primary: 222.2 47.4% 11.2%; --primary-foreground: 210 40% 98%; }}
        .dark {{ --background: 222.2 84% 4.9%; --foreground: 210 40% 98%; --card: 222.2 84% 4.9%; --card-foreground: 210 40% 98%; --muted: 217.2 32.6% 17.5%; --muted-foreground: 215 20.2% 65.1%; --border: 217.2 32.6% 17.5%; --primary: 210 40% 98%; --primary-foreground: 222.2 47.4% 11.2%; }}
        * {{ box-sizing: border-box; border-color: hsl(var(--border)); }} body {{ margin:0; background: radial-gradient(circle at top left, rgba(34,197,94,.12), transparent 26rem), hsl(var(--background)); color: hsl(var(--foreground)); font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }}
        .container {{ width:min(1240px, calc(100% - 2rem)); margin:0 auto; padding:2rem 0 3rem; }} .grid {{ display:grid; }} .gap-1 {{ gap:.25rem; }} .gap-2 {{ gap:.5rem; }} .gap-3 {{ gap:.75rem; }} .gap-4 {{ gap:1rem; }} .gap-6 {{ gap:1.5rem; }} .cards {{ grid-template-columns: repeat(2, minmax(0,1fr)); }} .overview {{ grid-template-columns: 1.2fr .8fr; }} .metrics {{ grid-template-columns: repeat(4, minmax(0,1fr)); }}
        .rounded-xl {{ border-radius:.75rem; }} .rounded-md {{ border-radius:.375rem; }} .border {{ border:1px solid hsl(var(--border)); }} .bg-card {{ background:hsl(var(--card)); }} .bg-muted {{ background:hsl(var(--muted)); }} .text-card-foreground {{ color:hsl(var(--card-foreground)); }} .text-muted-foreground {{ color:hsl(var(--muted-foreground)); }} .shadow-sm {{ box-shadow:0 1px 2px rgba(0,0,0,.25); }}
        .flex {{ display:flex; }} .flex-col {{ flex-direction:column; }} .items-center {{ align-items:center; }} .items-start {{ align-items:flex-start; }} .justify-between {{ justify-content:space-between; }} .p-6 {{ padding:1.5rem; }} .pt-0 {{ padding-top:0; }} .px-2 {{ padding-left:.5rem; padding-right:.5rem; }} .py-1 {{ padding-top:.25rem; padding-bottom:.25rem; }}
        .text-xs {{ font-size:.75rem; line-height:1rem; }} .text-sm {{ font-size:.875rem; line-height:1.25rem; }} .text-lg {{ font-size:1.125rem; line-height:1.75rem; }} .text-3xl {{ font-size:1.875rem; line-height:2.25rem; }} .font-medium {{ font-weight:500; }} .font-semibold {{ font-weight:600; }} .uppercase {{ text-transform:uppercase; }} .tracking-wide {{ letter-spacing:.025em; }} .tracking-tight {{ letter-spacing:-.025em; }} .leading-none {{ line-height:1; }} .break-anywhere {{ overflow-wrap:anywhere; white-space:normal; }}
        h1 {{ margin:0; font-size:clamp(2rem,5vw,4rem); line-height:1; letter-spacing:-.05em; }} h2,h3,p,dl,dd {{ margin:0; }} dt {{ margin:0; }} .hero,.panel {{ background: linear-gradient(135deg, hsl(var(--card)), hsl(var(--muted))); }}
        .badge {{ display:inline-flex; align-items:center; border-radius:999px; border:1px solid hsl(var(--border)); padding:.25rem .6rem; font-size:.75rem; font-weight:600; text-transform:uppercase; white-space:nowrap; }} .badge-green {{ background:#14532d; color:#dcfce7; border-color:#166534; }} .badge-red {{ background:#7f1d1d; color:#fee2e2; border-color:#991b1b; }} .badge-yellow {{ background:#713f12; color:#fef3c7; border-color:#854d0e; }} .badge-not_configured {{ background:#0c4a6e; color:#e0f2fe; border-color:#075985; }}
        .status-icon {{ display:inline-grid; place-items:center; width:1.5rem; height:1.5rem; border-radius:999px; border:1px solid hsl(var(--border)); font-weight:900; }} .status-green {{ color:#86efac; }} .status-red {{ color:#fca5a5; }} .status-yellow {{ color:#fde68a; }} .status-not_configured {{ color:#7dd3fc; }}
        .chart-track {{ height:.65rem; overflow:hidden; border-radius:999px; background:hsl(var(--muted)); border:1px solid hsl(var(--border)); }} .chart-fill {{ display:block; height:100%; min-width:2px; border-radius:999px; }} .chart-green {{ background:#22c55e; }} .chart-red {{ background:#ef4444; }} .chart-yellow {{ background:#f59e0b; }} .chart-not_configured {{ background:#0ea5e9; }} .chart-row {{ display:grid; gap:.4rem; }}
        .score-ring {{ width:9rem; height:9rem; border-radius:999px; display:grid; place-items:center; background:conic-gradient(#22c55e calc(var(--score) * 1%), hsl(var(--muted)) 0); }} .score-ring > div {{ width:7rem; height:7rem; border-radius:999px; display:grid; place-items:center; background:hsl(var(--card)); border:1px solid hsl(var(--border)); }}
        .filter-button,.card-toggle {{ font:inherit; color:inherit; }} .filter-button {{ cursor:pointer; background:hsl(var(--card)); }} .filter-button.active {{ background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); }} .card-toggle {{ width:100%; text-align:left; background:transparent; border:0; cursor:pointer; padding:1.5rem; }} .check-card[hidden] {{ display:none; }}
        @media (max-width: 900px) {{ .cards,.overview,.metrics {{ grid-template-columns:1fr; }} .container {{ width:min(100% - 1rem, 1240px); padding-top:.5rem; }} }}
      </style>
    </head>
    <body>
      <main class="container grid gap-6">
        <section class="hero rounded-xl border bg-card text-card-foreground shadow-sm p-6 grid gap-4">
          <div class="text-xs font-semibold uppercase tracking-wide text-muted-foreground">application services · kind-first local path · configured live Kubernetes API</div>
          <div class="grid gap-3"><h1>{escape(payload['title'])}</h1><p class="text-muted-foreground">{escape(payload['description'])}</p></div>
          <div class="flex gap-2" style="flex-wrap:wrap">
            <span class="badge badge-{escape(payload['overallStatus'])}">Overall {escape(payload['overallStatus'])}</span>
            <span class="badge">Version {escape(payload['version'])}</span>
            <span class="badge">Source {escape(payload['source'])}</span>
            <span class="badge">JSON /status.json</span>
          </div>
        </section>
        <section class="overview grid gap-4" aria-label="Overview">
          <article class="panel rounded-xl border bg-card text-card-foreground shadow-sm p-6 grid gap-4">
            <div class="flex items-start justify-between gap-4"><div class="grid gap-1"><h2 class="text-lg font-semibold tracking-tight">Configured check overview</h2><p class="text-sm text-muted-foreground">shadcn/ui chart-style distribution of live Kubernetes API checks.</p></div><span class="badge badge-{escape(payload['overallStatus'])}">{escape(payload['overallStatus'])}</span></div>
            <div class="metrics grid gap-3">
              <div class="rounded-md border bg-card p-6"><p class="text-xs uppercase tracking-wide text-muted-foreground">Passing</p><p class="text-3xl font-semibold">{summary['green']}</p></div>
              <div class="rounded-md border bg-card p-6"><p class="text-xs uppercase tracking-wide text-muted-foreground">Failing</p><p class="text-3xl font-semibold">{summary['red']}</p></div>
              <div class="rounded-md border bg-card p-6"><p class="text-xs uppercase tracking-wide text-muted-foreground">Enabled</p><p class="text-3xl font-semibold">{summary['enabled']}</p></div>
              <div class="rounded-md border bg-card p-6"><p class="text-xs uppercase tracking-wide text-muted-foreground">Total</p><p class="text-3xl font-semibold">{summary['total']}</p></div>
            </div>
            <div class="grid gap-3">{''.join(chart_rows)}</div>
          </article>
          <article class="rounded-xl border bg-card text-card-foreground shadow-sm p-6 grid gap-4">
            <div class="flex items-start justify-between gap-4"><div><h2 class="text-lg font-semibold tracking-tight">Health score</h2><p class="text-sm text-muted-foreground">Enabled checks only.</p></div><span class="badge">{summary['enabled']} enabled</span></div>
            <div class="flex items-center justify-between gap-4" style="flex-wrap:wrap"><div class="score-ring" style="--score:{payload['healthScore']}"><div><strong class="text-3xl">{payload['healthScore']}%</strong></div></div><div class="grid gap-2 text-sm"><p><strong>{summary['green']}</strong> green checks</p><p><strong>{summary['not_configured']}</strong> intentionally not configured</p><p class="text-muted-foreground">Use the filters below to inspect failing, passing, or reserved checks.</p></div></div>
          </article>
        </section>
        <section class="flex gap-2" style="flex-wrap:wrap" aria-label="Check filters">
          <button class="filter-button active badge" data-filter="all" type="button">All</button>
          <button class="filter-button badge" data-filter="green" type="button">Passing</button>
          <button class="filter-button badge" data-filter="red" type="button">Failing</button>
          <button class="filter-button badge" data-filter="not_configured" type="button">Not configured</button>
        </section>
        <section class="cards grid gap-4" aria-label="Validation checks">{''.join(cards)}</section>
        <p class="text-sm text-muted-foreground">Generated at {escape(payload['generatedAt'])}. Checks and monitored Kubernetes resources are configured through the validation-status-config ConfigMap. UI hard rule: implement with shadcn/ui framework conventions and shadcn/ui chart modules for graphing/interactive overview components.</p>
      </main>
      <script>
        document.querySelectorAll('.filter-button').forEach((button) => button.addEventListener('click', () => {{
          const filter = button.dataset.filter;
          document.querySelectorAll('.filter-button').forEach((b) => b.classList.toggle('active', b === button));
          document.querySelectorAll('.check-card').forEach((card) => {{ card.hidden = filter !== 'all' && card.dataset.state !== filter; }});
        }}));
        document.querySelectorAll('.card-toggle').forEach((button) => button.addEventListener('click', () => {{
          const expanded = button.getAttribute('aria-expanded') === 'true';
          button.setAttribute('aria-expanded', String(!expanded));
          button.closest('.check-card').querySelector('.card-details').hidden = expanded;
        }}));
      </script>
    </body>
    </html>"""

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path in ("/status.json", "/status"):
                body = json.dumps(status_payload(), indent=2).encode("utf-8")
                self.send_response(200); self.send_header("Content-Type", "application/json; charset=utf-8"); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body); return
            if self.path in ("/", "/index.html"):
                body = render_html(status_payload()).encode("utf-8")
                self.send_response(200); self.send_header("Content-Type", "text/html; charset=utf-8"); self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body); return
            self.send_response(404); self.end_headers()
        def log_message(self, format, *args):
            print("%s - - [%s] %s" % (self.client_address[0], self.log_date_time_string(), format % args), flush=True)

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
