apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-smoke
  namespace: flux-system
  labels:
    app.kubernetes.io/name: kyverno-smoke
    app.kubernetes.io/part-of: kubecrate
    kubecrate.io/workload-category: application-services
spec:
  dependsOn:
    - name: kyverno-smoke-policy
  interval: 1m0s
  path: ./compositions/vanilla/platform-services/kyverno/smoke
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system-sync
  timeout: 5m0s
  wait: false
