apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecrate-status
spec:
  template:
    metadata:
      annotations:
        kubecrate-status.kubecrate.io/eso-secret-projection: "enabled-v070"
    spec:
      containers:
        - name: app
          volumeMounts:
            - name: eso-smoke-projected
              mountPath: /var/run/kubecrate/eso-smoke
              readOnly: true
      volumes:
        - name: eso-smoke-projected
          secret:
            secretName: eso-smoke-projected
            optional: true
