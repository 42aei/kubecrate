apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubecrate-status-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["eso-smoke-projected"]
    verbs: ["get"]
  - apiGroups: ["external-secrets.io"]
    resources: ["secretstores", "externalsecrets"]
    verbs: ["get"]
