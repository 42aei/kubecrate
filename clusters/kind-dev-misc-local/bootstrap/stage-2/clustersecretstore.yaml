apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: seed-secrets-store
  annotations:
    kubecrate.io/description: Bootstrap installation reads the seed-secrets Secret through the Kubernetes provider so Flux can consume narrow projected credentials.
  labels:
    app.kubernetes.io/part-of: kubecrate
    kubecrate.io/lifecycle-phase: bootstrap-installation
spec:
  provider:
    kubernetes:
      remoteNamespace: eso
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: eso
          key: ca.crt
      auth:
        serviceAccount:
          name: seed-secrets-store-reader
          namespace: eso
