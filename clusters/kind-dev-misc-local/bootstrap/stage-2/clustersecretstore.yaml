apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: seed-secrets-store
  labels:
    app.kubernetes.io/part-of: kubecrate
spec:
  provider:
    kubernetes:
      remoteNamespace: core-external-secrets-operator
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: core-external-secrets-operator
          key: ca.crt
      auth:
        serviceAccount:
          name: seed-secrets-store-reader
          namespace: core-external-secrets-operator
