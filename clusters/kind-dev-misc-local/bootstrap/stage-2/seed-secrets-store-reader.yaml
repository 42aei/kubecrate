apiVersion: v1
kind: ServiceAccount
metadata:
  name: seed-secrets-store-reader
  namespace: core-external-secrets-operator
  labels:
    app.kubernetes.io/part-of: kubecrate
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: seed-secrets-store-reader
  namespace: core-external-secrets-operator
  labels:
    app.kubernetes.io/part-of: kubecrate
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: seed-secrets-store-reader
  namespace: core-external-secrets-operator
  labels:
    app.kubernetes.io/part-of: kubecrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: seed-secrets-store-reader
subjects:
  - kind: ServiceAccount
    name: seed-secrets-store-reader
    namespace: core-external-secrets-operator
