apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-secrets
  namespace: core-external-secrets-operator
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: kubecrate
    kubecrate.io/lifecycle-phase: bootstrap-installation
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-secrets
        app.kubernetes.io/part-of: kubecrate
        kubecrate.io/lifecycle-phase: bootstrap-installation
    spec:
      serviceAccountName: external-secrets
      automountServiceAccountToken: true
      securityContext:
        fsGroup: 1000
      containers:
        - name: external-secrets
          image: ghcr.io/external-secrets/external-secrets:v2.6.0
          imagePullPolicy: IfNotPresent
          args:
            - --concurrent=1
            - --metrics-addr=:8080
            - --loglevel=info
            - --zap-time-encoding=epoch
          ports:
            - containerPort: 8080
              name: metrics
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
