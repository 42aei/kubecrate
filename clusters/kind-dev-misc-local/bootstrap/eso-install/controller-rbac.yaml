apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-secrets-controller
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: kubecrate
rules:
  - apiGroups:
      - external-secrets.io
    resources:
      - secretstores
      - clustersecretstores
      - externalsecrets
      - clusterexternalsecrets
      - pushsecrets
      - clusterpushsecrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
      - externalsecrets/status
      - externalsecrets/finalizers
      - secretstores
      - secretstores/status
      - secretstores/finalizers
      - clustersecretstores
      - clustersecretstores/status
      - clustersecretstores/finalizers
      - clusterexternalsecrets
      - clusterexternalsecrets/status
      - clusterexternalsecrets/finalizers
      - pushsecrets
      - pushsecrets/status
      - pushsecrets/finalizers
      - clusterpushsecrets
      - clusterpushsecrets/status
      - clusterpushsecrets/finalizers
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - generators.external-secrets.io
    resources:
      - generatorstates
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
      - deletecollection
  - apiGroups:
      - generators.external-secrets.io
    resources:
      - acraccesstokens
      - cloudsmithaccesstokens
      - clustergenerators
      - ecrauthorizationtokens
      - fakes
      - gcraccesstokens
      - githubaccesstokens
      - quayaccesstokens
      - passwords
      - sshkeys
      - stssessiontokens
      - uuids
      - vaultdynamicsecrets
      - webhooks
      - grafanas
      - mfas
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
      - namespaces
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - update
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  # ESO v2.6.0 controller needs cluster-scope secret access for cache reads and target Secret reconciliation.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups:
      - ""
    resources:
      - serviceaccounts/token
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - external-secrets.io
    resources:
      - externalsecrets
      - pushsecrets
    verbs:
      - create
      - update
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-secrets-controller
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: kubecrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-secrets-controller
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: core-external-secrets-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-leaderelection
  namespace: core-external-secrets-operator
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: kubecrate
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - create
      - get
      - update
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-leaderelection
  namespace: core-external-secrets-operator
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: kubecrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-leaderelection
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: core-external-secrets-operator
