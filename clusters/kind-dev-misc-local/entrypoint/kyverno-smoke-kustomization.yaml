apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kyverno-smoke
  namespace: flux-system
  labels:
    app.kubernetes.io/name: kyverno-smoke
    app.kubernetes.io/part-of: kubecrate
    kubecrate.io/workload-category: platform-services
spec:
  dependsOn:
    - name: kyverno
  interval: 1m0s
  path: ./clusters/kind-dev-misc-local/platform-services/kyverno/smoke
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m0s
  wait: true
  healthChecks:
    - apiVersion: kyverno.io/v1
      kind: ClusterPolicy
      name: require-ns-label
      namespace: ""
