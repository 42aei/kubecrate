apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-seed-secrets-reader
  namespace: core-external-secrets-operator
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: kubecrate
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-seed-secrets-reader
  namespace: core-external-secrets-operator
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: kubecrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-seed-secrets-reader
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: core-external-secrets-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: external-secrets-flux-system-secret-writer
  namespace: flux-system
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: kubecrate
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: external-secrets-flux-system-secret-writer
  namespace: flux-system
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/part-of: kubecrate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: external-secrets-flux-system-secret-writer
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: core-external-secrets-operator
