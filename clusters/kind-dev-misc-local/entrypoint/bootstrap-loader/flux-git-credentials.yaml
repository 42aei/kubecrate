apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-system
  namespace: flux-system
  annotations:
    kubecrate.io/description: Narrow ESO projection for Flux HTTPS Git credentials using username and password keys.
  labels:
    app.kubernetes.io/part-of: kubecrate
    kubecrate.io/lifecycle-phase: bootstrap-installation
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: seed-secrets-store
  target:
    name: flux-system
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/part-of: kubecrate
          kubecrate.io/purpose: flux-git-auth
  data:
    - secretKey: username
      remoteRef:
        key: seed-secrets
        property: SEED_FLUX_GIT_USERNAME
    - secretKey: password
      remoteRef:
        key: seed-secrets
        property: SEED_FLUX_GIT_PAT
