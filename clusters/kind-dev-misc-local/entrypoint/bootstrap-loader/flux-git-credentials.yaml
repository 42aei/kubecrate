apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-system
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: kubecrate
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: seed-secrets-store
  target:
    name: flux-system
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: username
      remoteRef:
        key: seed-secrets
        property: SEED_FLUX_GIT_USERNAME
    - secretKey: password
      remoteRef:
        key: seed-secrets
        property: SEED_FLUX_GIT_PAT
