apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flux-system
resources:
  - ../../../../platform-services/flux/base
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: flux-values
    files:
      - values.yaml=./helm-values.yaml
  - name: flux-sync-values
    files:
      - values.yaml=./helm-values-sync.yaml
