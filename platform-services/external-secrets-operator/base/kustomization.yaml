apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.6.0
    releaseName: external-secrets
    namespace: core-external-secrets-operator
    includeCRDs: true
    valuesFile: ./values.yaml
