apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netbird-operator
  namespace: core-netbird-operator
  labels:
    app.kubernetes.io/name: netbird-operator
    app.kubernetes.io/part-of: kubecrate
    kubecrate.io/workload-category: platform-services
spec:
  interval: 30m0s
  releaseName: netbird-operator
  targetNamespace: core-netbird-operator
  timeout: 5m0s
  chart:
    spec:
      chart: netbird-operator
      sourceRef:
        kind: HelmRepository
        name: netbird-operator
        namespace: core-netbird-operator
      version: 0.9.0
  install:
    createNamespace: false
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
  valuesFrom:
    - kind: ConfigMap
      name: netbird-operator-values
      valuesKey: values.yaml
